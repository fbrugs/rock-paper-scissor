<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock paper scissor</title>
    <script src="rps.js" defer></script>
    <link rel="stylesheet" href="style.css">

    <style>
        p {font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; font-size: 24px;}
    </style>

</head>
<body>

    <p> Simple rock-paper-scissor</p>
    <div class="result">Human: 0 Computer: 0 Draws: 0</div>
    <div class="container">
        <button class="play-button" id="rock">Rock</button>
        <button class="play-button" id="paper">Paper</button>
        <button class="play-button" id="scissors">Scissor</button>
    </div>
    <div class="winner"></div>
    
</body>
</html>
